<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="/frontend/public/assets/styles/ls.css">
</head>
<body>
  <div class="app-header" onclick="window.location.href = 'guest.html';">
    <img src="assets/images/logo.png" alt="Music App Logo" class="app-logo">
    <h1 class="app-name">SAGA</h1>
  </div>
  <div class="form-container">
    <h1>Login</h1>
    <form id="loginForm">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="loginMessage"></p>
    <a href="signup.html">Don't have an account? Sign up</a>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
