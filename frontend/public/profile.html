<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile</title>
  <link rel="stylesheet" href="assets/styles/profile.css">
  <script src="https://kit.fontawesome.com/7cc81ca99c.js" crossorigin="anonymous"></script>
  <script src="js/profile.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="assets/images/logo.png" style="height: 80px; border-radius: 50%;" alt="Music App Logo">
      <h1>SAGA</h1>
    </div>
    <nav>
      <ul>
        <li><a href="dashboard.html"><i class="fa-solid fa-home"></i></a></li>
        <li><a href="#" id="logout">Logout</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="profile-form">
      <h2>Edit Profile</h2>
      <form id="profileForm">
        <div class="form-group">
          <label for="username">Username (read-only):</label>
          <input type="text" id="username" name="username" readonly>
        </div>
        <div class="form-group">
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" name="fullName" required>
        </div>
        <div class="form-group">
          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required>
        </div>
        <div class="form-group">
          <label for="bio">Bio:</label>
          <textarea id="bio" name="bio" rows="4" placeholder="Write a short bio about yourself"></textarea>
        </div>
        <div class="form-group">
          <label for="avatarUrl">Avatar URL:</label>
          <input type="url" id="avatarUrl" name="avatarUrl" placeholder="Enter a link to your profile picture">
        </div>
        <button type="submit">Save Profile</button>
      </form>
    </section>
  </main>

  <footer>
    <p style="text-align: center;">&copy; 2024 Music App. All rights reserved.</p>
  </footer>
</body>
</html>
